<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Platforms and Prompt Engineering Quiz</title>
<style>
  :root{
    --bg:#f3f5f9; --card:#fff; --ink:#1b2333; --muted:#6b7589; --line:#e2e6ee;
    --brand:#2f5bea; --brand-d:#2347c0; --brand-l:#eaf0ff;
    --ok:#12935b; --ok-l:#e4f6ee; --bad:#d4342c; --bad-l:#fdecea; --warn:#b7791f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:10;background:#0f1a3a;color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.18)}
  .bar{max-width:920px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{font-weight:700;font-size:17px;letter-spacing:.2px;margin-right:auto;display:flex;align-items:center;gap:10px;line-height:1.2}
  .brand small{display:block;font-weight:500;font-size:11.5px;opacity:.65;letter-spacing:.3px}
  .logo{flex:none;width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#5b82ff,#2f5bea);display:grid;place-items:center;font-size:16px}
  .stat{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:4px 12px;border-radius:10px;background:rgba(255,255,255,.08)}
  .stat small{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;opacity:.7}
  .stat b{font-size:19px;font-variant-numeric:tabular-nums}
  .stat.ok b{color:#5be0a4}.stat.bad b{color:#ff8a82}
  .stat.timer.low{background:rgba(212,52,44,.35);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.65}}
  .progress{height:4px;background:rgba(255,255,255,.15)}
  .progress i{display:block;height:100%;width:0;background:#5b82ff;transition:width .3s}
  main{max-width:920px;margin:28px auto;padding:0 20px 50px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;box-shadow:0 4px 20px rgba(20,35,80,.06)}
  .qmeta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.7px}
  .sec{color:var(--brand)}
  h1,h2{margin:0}
  .qtext{font-size:21px;font-weight:650;margin:12px 0 6px;line-height:1.4}
  .hint{color:var(--muted);font-size:14px;margin-bottom:20px}
  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{display:flex;align-items:center;gap:14px;padding:14px 16px;border:2px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s;background:#fff}
  .opt:hover{border-color:#b8c6f5;background:#f8faff}
  .opt input{position:absolute;opacity:0}
  .box{flex:none;width:22px;height:22px;border:2px solid #b4bccd;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700;transition:.15s}
  .single .box{border-radius:50%}
  .opt.sel{border-color:var(--brand);background:var(--brand-l)}
  .opt.sel .box{background:var(--brand);border-color:var(--brand)}
  .opt.sel .box::after{content:"✓"}
  .opt:has(input:focus-visible){outline:3px solid #9fb6ff;outline-offset:2px}
  .opt.locked{cursor:default}
  .opt.right{border-color:var(--ok);background:var(--ok-l)}
  .opt.right .box{background:var(--ok);border-color:var(--ok)}
  .opt.right .box::after{content:"✓"}
  .opt.wrong{border-color:var(--bad);background:var(--bad-l)}
  .opt.wrong .box{background:var(--bad);border-color:var(--bad)}
  .opt.wrong .box::after{content:"✕"}
  .opt code{font:13.5px ui-monospace,Menlo,Consolas,monospace;background:rgba(20,35,80,.07);padding:1px 5px;border-radius:4px}
  .opt .tag{margin-left:auto;padding-left:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
  .opt.right .tag{color:var(--ok)}.opt.wrong .tag{color:var(--bad)}
  .feedback{margin-top:20px;padding:14px 16px;border-radius:12px;font-size:15px}
  .feedback.ok{background:var(--ok-l);color:#0b6b43;border:1px solid #b6e4cf}
  .feedback.bad{background:var(--bad-l);color:#9c231d;border:1px solid #f4c3bf}
  .feedback strong{display:block;font-size:16px}
  .actions{display:flex;justify-content:flex-end;gap:12px;margin-top:26px}
  button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 26px;cursor:pointer;background:var(--brand);color:#fff;transition:.15s}
  button:hover:not(:disabled){background:var(--brand-d)}
  button:disabled{background:#c5cde0;cursor:not-allowed}
  .center{text-align:center}
  .center h1{font-size:30px;margin-bottom:6px}
  .sub{color:var(--brand);font-weight:600;font-size:14px;margin-bottom:14px}
  .center p{color:var(--muted);max-width:560px;margin:0 auto 22px}
  .facts{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:24px 0}
  .fact{padding:14px 22px;border:1px solid var(--line);border-radius:12px;background:#fafbfe}
  .fact b{display:block;font-size:22px}.fact span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .field{display:block;max-width:360px;margin:0 auto 22px;text-align:left;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
  .field input{display:block;width:100%;margin-top:6px;padding:11px 14px;font:16px inherit;border:2px solid var(--line);border-radius:10px;text-transform:none;letter-spacing:0;color:var(--ink)}
  .field input:focus{outline:none;border-color:var(--brand)}
  .ring{width:150px;height:150px;border-radius:50%;margin:10px auto 16px;display:grid;place-items:center;background:conic-gradient(var(--c) calc(var(--p)*1%),#e8ecf4 0)}
  .ring div{width:116px;height:116px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:32px;font-weight:700}
  .review{margin-top:28px;text-align:left}
  .review h3{margin:18px 0 10px;font-size:15px;color:var(--brand)}
  .ritem{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:14.5px}
  .ritem .dot{flex:none;width:24px;height:24px;border-radius:50%;color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
  .ritem.ok .dot{background:var(--ok)}.ritem.bad .dot{background:var(--bad)}
  .ritem small{display:block;color:var(--muted)}
  @media(max-width:600px){.card{padding:22px}.qtext{font-size:18px}.bar{gap:8px}.brand{width:100%}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span class="logo">?</span><div>LLM Platforms &amp; Prompt Engineering<small>Annotate Tech · Question Paper</small></div></div>
    <div class="stat timer" id="timerBox"><small>Time left</small><b id="timer">--:--</b></div>
    <div class="stat ok"><small>Right</small><b id="right">0</b></div>
    <div class="stat bad"><small>Wrong</small><b id="wrong">0</b></div>
    <div class="stat"><small>Score</small><b id="score">0</b></div>
  </div>
  <div class="progress"><i id="prog"></i></div>
</header>

<main><div class="card" id="view"></div></main>

<script>
// ---------- Configuration ----------
const TITLE = "LLM Platforms and Prompt Engineering — MCQs";
const SUBTITLE = "17 October 2026 · Annotate Tech · Question Paper";
const TIME_LIMIT_SECONDS = 45 * 60;
const POINTS_PER_QUESTION = 1;

// Each question: [text, [options A..D], [correct option indexes]]
// Add more indexes to the answer array to make a question multi-answer.
const SECTIONS = [
 ["LLM Platforms",[
  ["Which of the following is an LLM platform (a service giving access to many models) rather than a single model?",["Amazon Bedrock","BERT","GPT-4o","Llama 3"],[0]],
  ["What is the main advantage of using an LLM through a hosted API instead of self-hosting it?",["Data never leaves your own network","Zero cost per request","Full control over the model weights","No need to provision and manage GPU infrastructure"],[3]],
  ["Which model family is released with open weights that you can download and run yourself?",["OpenAI GPT-4o","Anthropic Claude","Meta Llama","Google Gemini"],[2]],
  ["In LLMs, what is a \"token\"?",["The password used to call the API","A complete sentence","Always exactly one character","A chunk of text, such as a word or part of a word, that the model processes"],[3]],
  ["What is the context window of an LLM?",["The size of the training dataset","The editor pane where results appear","The maximum number of tokens the model can handle in one request, including input and output","The number of users who can call the model at once"],[2]]]],
 ["Accessing LLMs: OpenAI SDK",[
  ["What is the recommended way to give your OpenAI API key to the SDK?",["Pass it as a URL query parameter","Hard-code it in the source file","Commit it to a shared GitHub repository","Set it in the `OPENAI_API_KEY` environment variable"],[3]],
  ["In the Chat Completions API, which message role sets the overall behaviour and instructions for the model?",["system","assistant","tool","user"],[0]],
  ["What does lowering the temperature (for example from 1.0 to 0.2) generally do?",["Reduces the cost per token","Makes output more focused and deterministic","Increases the context window","Makes output more random and creative"],[1]],
  ["What does the `max_tokens` (maximum output tokens) parameter control?",["The number of requests per minute","The size of the context window","The upper limit on tokens the model may generate in its response","The number of examples in the prompt"],[2]]]],
 ["Accessing LLMs: GitHub Copilot",[
  ["What is GitHub Copilot?",["A version control system that replaces Git","A code hosting service","An AI coding assistant that suggests code and answers questions inside the editor","A CI/CD pipeline tool"],[2]],
  ["What do you need to start using GitHub Copilot in STS?",["An on-premises GitHub Enterprise server","An OpenAI API key pasted into settings","A GitHub account with Copilot access, plus the Copilot extension installed and signed in","A local GPU with at least 24 GB of memory"],[2]],
  ["How do you usually accept an inline Copilot suggestion (grey ghost text)?",["Press Tab","Press Esc","Right-click and choose Commit","Press Ctrl+Z"],[0]],
  ["In Copilot Chat, what does the `/tests` slash command do?",["Generates unit tests for the selected code","Deletes failing tests","Runs the test suite on GitHub Actions","Lists all repositories"],[0]],
  ["Which practice matters most when using Copilot suggestions in production code?",["Paste secrets into chat so Copilot can configure them","Disable linters so suggestions are not flagged","Review, test and security-check suggestions like any other code","Accept suggestions without reading them to save time"],[2]]]],
 ["Responsible AI: Bias, Limitations and Security",[
  ["An LLM confidently cites a court case that does not exist. What is this called?",["Overfitting","Fine-tuning","Tokenization","Hallucination"],[3]],
  ["What is the main source of bias in LLM outputs?",["Biases present in the training data","The temperature setting alone","The length of the API key","The user's keyboard layout"],[0]],
  ["What is prompt injection?",["A technique to speed up inference","Malicious text in user input or retrieved content that tries to override the system's instructions","Compressing prompts to save tokens","A method for adding few-shot examples"],[1]],
  ["Which practice best protects sensitive data when using a public LLM service?",["Assume prompts are never stored anywhere","Share production database passwords so the model can help","Include full customer account numbers for accuracy","Mask or remove personal and confidential data before sending prompts"],[3]],
  ["Why might an LLM give wrong answers about recent events?",["Recent events are encrypted","LLMs can only process numbers","It deliberately hides recent news","Its knowledge stops at its training cutoff unless current information is supplied"],[3]],
  ["What does \"human in the loop\" mean?",["Users must stay online while the model trains","The model is trained only by people typing","A person reviews or approves AI outputs before high-impact decisions are acted on","A human replaces the model entirely"],[2]],
  ["A bank's LLM screening tool rejects far more loan applicants from one region. Which Responsible AI concern is this?",["Context window size","Fairness and bias","Token cost","Latency"],[1]]]],
 ["Prompt Engineering Introduction",[
  ["Which best describes prompt engineering?",["Retraining a model's weights on new data","Writing the model's tokenizer","Building GPU hardware for LLMs","Designing and refining inputs to guide an LLM toward the desired output"],[3]],
  ["Which is a characteristic of a good prompt?",["No mention of the audience","Several unrelated tasks in one sentence","As short as possible, even if vague","A clear task, relevant context and the expected output format"],[3]],
  ["Why is prompt engineering usually tried before fine-tuning?",["Prompts permanently change the model's weights","Fine-tuning never improves results","It is faster and cheaper, and often good enough","Fine-tuning is impossible for all models"],[2]],
  ["What is iterative prompt refinement?",["Translating the prompt into several languages","Testing a prompt, reviewing the output and adjusting the prompt until results are reliable","Raising the temperature on every attempt","Sending the same prompt repeatedly hoping for a different answer"],[1]]]],
 ["Prompt Types: Instruction, Completion, Dialogue, Chain-of-Thought",[
  ["What is a completion-style prompt?",["A prompt that assigns a persona","The start of a text that the model continues, e.g. \"The three benefits of cloud computing are\"","A multi-turn conversation","A request to reason step by step"],[1]],
  ["What is a dialogue (conversational) prompt?",["A sequence of turns, such as user and assistant messages, so the model replies in the context of the conversation","A prompt containing a single word","A prompt that forces code-only output","A prompt that must include JSON"],[0]],
  ["\"Summarise this report in five bullet points for senior management.\" Which prompt type is this?",["Completion","Instruction","Dialogue","Few-shot"],[1]],
  ["Which prompt type suits a multi-step maths word problem best?",["Chain-of-thought","Dialogue with no question","Zero-shot with a five-word limit","Completion"],[0]],
  ["With instruction-tuned models, what is the main advantage of instruction prompts over completion prompts?",["They work only with images","They need no text at all","They disable the system role","The task is stated directly, so the intent is clearer"],[3]]]],
 ["Few-shot Prompting",[
  ["What is few-shot prompting?",["Including a few input–output examples in the prompt to show the desired pattern","Training the model on a few thousand records","Sending a few prompts in parallel","Limiting the answer to a few words"],[0]],
  ["When is few-shot prompting most useful?",["When you want the model to ignore format","When the task is a simple factual question","When you need a custom label set or output format the model cannot guess","When the context window is almost full"],[2]],
  ["What is a common risk of few-shot prompting?",["It cannot be used with chat models","It deletes the system prompt","It always increases hallucination","The model copies surface features of the examples, such as always choosing the same label, if they are not varied"],[3]],
  ["What is a prompt with exactly one example called?",["Zero-shot","One-shot","Chain-of-thought","Multi-turn"],[1]]]],
 ["Zero-shot Prompting",[
  ["What is zero-shot prompting?",["Using a model with zero parameters","Giving the model no instructions","Asking the model to perform a task without giving any examples","Setting the temperature to zero"],[2]],
  ["Which of these is a zero-shot prompt?",["Here are three sample answers; write a fourth in the same style.","Classify this review as positive or negative: \"Delivery was late.\"","Prompt 1: list complaints. Prompt 2: group them into themes.","\"Great!\" → Positive. \"Awful\" → Negative. \"Okay\" → ?"],[1]],
  ["Which phrase is commonly added to a zero-shot prompt to trigger chain-of-thought reasoning?",["\"Let's think step by step.\"","\"Ignore previous instructions.\"","\"Use JSON only.\"","\"Answer in one word.\""],[0]]]],
 ["Chain-of-Thought Prompting for Reasoning and Problem Solving",[
  ["What is the main benefit of chain-of-thought prompting?",["It guarantees correct answers","It improves accuracy on multi-step problems by having the model work through intermediate steps","It reduces token usage","It removes the need for context"],[1]],
  ["What is a trade-off of chain-of-thought prompting?",["It lowers accuracy on all tasks","Longer responses, which increase latency and token cost","It stops the model from answering","It works only with images"],[1]],
  ["What is few-shot chain-of-thought?",["Running a few prompts in parallel","Giving examples without answers","Asking for answers in a few words","Giving examples that include worked reasoning steps, not just final answers"],[3]],
  ["For which task is chain-of-thought LEAST necessary?",["Finding a logic error in code","Estimating peak load for system capacity planning","Translating a short greeting into French","Calculating the EMI on a loan"],[2]]]],
 ["Constraints",[
  ["Which of these is a constraint in a prompt?",["\"You are a senior architect.\"","\"Here are three examples.\"","\"Answer in under 100 words and do not mention competitor names.\"","\"Think step by step.\""],[2]],
  ["Why should a negative constraint (\"don't…\") be paired with a positive instruction (\"do this instead\")?",["Models follow clear positive guidance more reliably than prohibitions alone","Models ignore all positive instructions","Positive instructions make requests free","Negative constraints are not allowed"],[0]],
  ["\"Answer only from the provided document; if the answer is not there, say 'Not in document'.\" What does this constraint mainly do?",["Speeds up tokenization","Increases creativity","Changes the model's training data","Reduces hallucination by grounding answers in the source"],[3]]]],
 ["Role Prompting and Persona Engineering",[
  ["What is role prompting?",["Assigning user permissions in the API","Assigning the model an identity or expertise, e.g. \"You are a senior Java architect\"","Giving the model a list of examples","Rotating API keys"],[1]],
  ["Where is a persona usually best placed in an API-based application?",["In the API key","In the system (or developer) message","In the `max_tokens` parameter","In the model name"],[1]],
  ["What is a limitation of role prompting?",["Roles make the model refuse every question","A role changes tone and framing but does not give the model knowledge it lacks","Roles disable chain-of-thought","Roles can only be used with zero-shot prompts"],[1]],
  ["Which persona prompt is best for explaining cloud computing to bank tellers?",["\"You are a patient trainer explaining to bank tellers with no IT background. Use simple banking analogies.\"","\"You are an AI.\"","\"Explain cloud.\"","\"You are a cloud expert. Use maximum technical depth.\""],[0]]]]
];
const QUESTIONS = SECTIONS.flatMap(([sec,qs])=>qs.map(([q,o,a])=>({sec,q,o,a})));

// ---------- State ----------
let idx=0, right=0, wrong=0, results=[], selected=new Set(), submitted=false, remaining=TIME_LIMIT_SECONDS, tick=null, candidate="";
const $=id=>document.getElementById(id), view=$("view");
const letters="ABCDEFGH";
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const rich=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>");   // `code` formatting
const plain=s=>s.replace(/`/g,"");
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
const TOTAL=QUESTIONS.length*POINTS_PER_QUESTION;

function updateHeader(){
  $("right").textContent=right; $("wrong").textContent=wrong;
  $("score").textContent=right*POINTS_PER_QUESTION;
  $("timer").textContent=fmt(Math.max(remaining,0));
  $("timerBox").classList.toggle("low",remaining<=120 && remaining>0);
  $("prog").style.width=(results.length/QUESTIONS.length*100)+"%";
}

function intro(){
  remaining=TIME_LIMIT_SECONDS; updateHeader();
  view.innerHTML=`<div class="center">
    <h1>${esc(TITLE)}</h1>
    <div class="sub">${esc(SUBTITLE)}</div>
    <p>Choose the <b>best answer</b> for each question, then press <b>Submit</b> to see straight away whether you were right or wrong. Your running score and the countdown timer stay visible at the top.</p>
    <div class="facts">
      <div class="fact"><b>${QUESTIONS.length}</b><span>Questions</span></div>
      <div class="fact"><b>${TIME_LIMIT_SECONDS/60} min</b><span>Time limit</span></div>
      <div class="fact"><b>${TOTAL}</b><span>Total marks</span></div>
    </div>
    <label class="field">Name<input id="name" type="text" placeholder="Enter your name" autocomplete="name"></label>
    <button id="start">Start Quiz</button></div>`;
  $("name").value=candidate;
  $("start").onclick=()=>{ candidate=$("name").value.trim(); start(); };
}

function start(){
  idx=right=wrong=0; results=[]; remaining=TIME_LIMIT_SECONDS;
  clearInterval(tick);
  tick=setInterval(()=>{ remaining--; updateHeader(); if(remaining<=0) finish(true); },1000);
  render();
}

function render(){
  const Q=QUESTIONS[idx], single=Q.a.length===1; selected=new Set(); submitted=false; updateHeader();
  view.innerHTML=`
    <div class="qmeta"><span>Question ${idx+1} of ${QUESTIONS.length}</span><span class="sec">${esc(Q.sec)}</span></div>
    <h2 class="qtext">${rich(Q.q)}</h2>
    <div class="hint">${single?"Choose the one best answer.":"Select all correct options."}</div>
    <div class="opts ${single?"single":""}" id="opts">${Q.o.map((t,i)=>`
      <label class="opt" data-i="${i}">
        <input type="checkbox" value="${i}"><span class="box"></span>
        <span><b>${letters[i]})</b> &nbsp;${rich(t)}</span><span class="tag"></span>
      </label>`).join("")}</div>
    <div id="fb"></div>
    <div class="actions"><button id="submit" disabled>Submit</button></div>`;
  const inputs=[...document.querySelectorAll(".opt input")];
  inputs.forEach(inp=>inp.onchange=()=>{
    if(submitted) return;
    const i=+inp.value;
    if(single){ selected.clear(); if(inp.checked) selected.add(i); }
    else inp.checked?selected.add(i):selected.delete(i);
    inputs.forEach(x=>{ x.checked=selected.has(+x.value); x.closest(".opt").classList.toggle("sel",x.checked); });
    $("submit").disabled=selected.size===0;
  });
  $("submit").onclick=submit;
}

function submit(){
  if(submitted) return; submitted=true;
  const Q=QUESTIONS[idx], correct=new Set(Q.a);
  const ok=selected.size===correct.size && [...selected].every(i=>correct.has(i));
  ok?right++:wrong++;
  results.push({sec:Q.sec,q:Q.q,ok,chosen:[...selected].sort(),a:Q.a,o:Q.o});
  document.querySelectorAll(".opt").forEach(l=>{
    const i=+l.dataset.i, inp=l.querySelector("input"), tag=l.querySelector(".tag");
    inp.disabled=true; l.classList.add("locked"); l.classList.remove("sel");
    if(correct.has(i)){ l.classList.add("right"); tag.textContent=selected.has(i)?"Correct":"Correct answer"; }
    else if(selected.has(i)){ l.classList.add("wrong"); tag.textContent="Your answer"; }
  });
  $("fb").innerHTML=`<div class="feedback ${ok?"ok":"bad"}"><strong>${ok?"✓ Right answer! +"+POINTS_PER_QUESTION+" mark":"✕ Wrong answer"}</strong></div>`;
  const last=idx===QUESTIONS.length-1;
  $("submit").textContent=last?"View Results":"Next Question →";
  $("submit").onclick=()=>{ last?finish(false):(idx++,render()); };
  updateHeader();
}

function finish(timedOut){
  clearInterval(tick);
  if(timedOut){   // unanswered questions count as wrong
    for(let i=results.length;i<QUESTIONS.length;i++){
      const Q=QUESTIONS[i]; results.push({sec:Q.sec,q:Q.q,ok:false,chosen:[],a:Q.a,o:Q.o,skipped:true}); wrong++;
    }
  }
  updateHeader(); $("prog").style.width="100%";
  const sc=right*POINTS_PER_QUESTION, pct=Math.round(sc/TOTAL*100);
  const color=pct>=70?"var(--ok)":pct>=40?"var(--warn)":"var(--bad)";
  const msg=pct>=70?"Excellent work!":pct>=40?"Good effort — keep practising.":"Keep learning, you'll get there.";
  const names=(r,arr)=>arr.length?arr.map(i=>`${letters[i]}) ${esc(plain(r.o[i]))}`).join("; "):"No answer";
  let lastSec="", list="";
  results.forEach((r,n)=>{
    if(r.sec!==lastSec){ list+=`<h3>${esc(r.sec)}</h3>`; lastSec=r.sec; }
    list+=`<div class="ritem ${r.ok?"ok":"bad"}"><span class="dot">${r.ok?"✓":"✕"}</span>
      <div><b>${n+1}. ${esc(plain(r.q))}</b>
      <small>Your answer: ${r.skipped?"Not answered":names(r,r.chosen)}</small>
      ${r.ok?"":`<small>Correct answer: ${names(r,r.a)}</small>`}</div></div>`;
  });
  view.innerHTML=`<div class="center">
    ${timedOut?'<p style="color:var(--bad);font-weight:600;margin-bottom:8px">⏱ Time is up!</p>':""}
    <h1>Quiz complete</h1>
    <div class="sub">${candidate?esc(candidate)+" · ":""}${esc(SUBTITLE)}</div>
    <p style="margin-bottom:0">${msg}</p>
    <div class="ring" style="--p:${pct};--c:${color}"><div>${pct}%</div></div>
    <div class="facts">
      <div class="fact"><b>${sc} / ${TOTAL}</b><span>Score</span></div>
      <div class="fact"><b style="color:var(--ok)">${right}</b><span>Right</span></div>
      <div class="fact"><b style="color:var(--bad)">${wrong}</b><span>Wrong</span></div>
      <div class="fact"><b>${fmt(TIME_LIMIT_SECONDS-Math.max(remaining,0))}</b><span>Time taken</span></div>
    </div>
    <button id="again">Retake Quiz</button>
    <div class="review"><h2 style="font-size:18px">Question review</h2>${list}</div></div>`;
  $("again").onclick=intro;
  window.scrollTo({top:0,behavior:"smooth"});
}

intro();
</script>
</body>
</html>
